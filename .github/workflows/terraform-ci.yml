name: terraform-ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
      - name: Check formatting
        run: tofu fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - tf-state-bootstrap
          - tf-ci-oidc
          - tf-lesson1
          - tf-vpc
          - tf-app
          - tf-db
          - envs/dev
          - envs/prod
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
      - name: Init without backend
        run: tofu init -backend=false
      - name: Validate
        run: tofu validate

  plan:
    if: github.event_name == 'pull_request'
    needs: [fmt, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [envs/dev, envs/prod]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1

      - name: Get AWS credentials (OIDC, no keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Init (with the S3 backend)
        run: tofu init -input=false

      - name: Plan
        run: |
          tofu plan -input=false -no-color -lock-timeout=60s -out=tfplan
          tofu show -no-color tfplan > plan.txt

      - name: Post plan as a PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('${{ matrix.dir }}/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Plan for \`${{ matrix.dir }}\`\n\`\`\`\n${plan}\n\`\`\``
            });

  apply-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [fmt, validate]
    runs-on: ubuntu-latest
    environment: dev
    concurrency: apply-dev
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1

      - name: Get AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Init
        run: tofu init -input=false

      - name: Plan
        run: tofu plan -input=false -no-color -lock-timeout=60s -out=tfplan

      - name: Apply
        run: tofu apply -input=false -lock-timeout=60s tfplan

  apply-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [apply-dev]
    runs-on: ubuntu-latest
    environment: prod
    concurrency: apply-prod
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1

      - name: Get AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Init
        run: tofu init -input=false

      - name: Plan
        run: tofu plan -input=false -no-color -lock-timeout=60s -out=tfplan

      - name: Apply
        run: tofu apply -input=false -lock-timeout=60s tfplan
